
name: Build and Sign APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Grant execute permission for gradlew
      run: |
        if [ ! -f gradlew ]; then
          gradle wrapper --gradle-version 8.2
        fi
        chmod +x gradlew
      
    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace
      
    - name: Generate Keystore
      run: |
        keytool -genkey -v -keystore release.keystore -alias kitten -keyalg RSA -keysize 2048 -validity 10000 -storepass kitten123 -keypass kitten123 -dname "CN=Kitten TTS, OU=Dev, O=KittenTTS, L=City, ST=State, C=US"
        
    - name: Sign APK with apksigner
      run: |
        UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
        echo "Unsigned APK: $UNSIGNED_APK"
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
          --ks release.keystore \
          --ks-pass pass:kitten123 \
          --key-pass pass:kitten123 \
          --ks-key-alias kitten \
          --out KittenTtsPico-signed.apk \
          $UNSIGNED_APK
        echo "✓ APK signed successfully"
        
    - name: Verify APK signature
      run: |
        $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose KittenTtsPico-signed.apk
        
    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: KittenTtsPico-Signed
        path: KittenTtsPico-signed.apk
        retention-days: 30
        
    - name: Create Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        files: KittenTtsPico-signed.apk
        name: Release v${{ github.run_number }}
        tag_name: v${{ github.run_number }}
        body: |
          Kitten TTS Pico APK
          
          Auto-built and signed with apksigner
          
          Build: ${{ github.run_number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
